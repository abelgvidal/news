# Which country a headline is about. Used to keep one story per country on an edition that asks for it
# (max_per_country in feeds.toml). Terms are lowercase, without accents, matched as whole words.
#   places: country name, demonym, capital, main cities, regions       -> weight 1.0 (a place does not travel)
#   people: leaders and ministers                                      -> weight 0.5 (they appear in other countries' stories)
#   iso: ISO 3166-1 alpha-2 code, used to show the country's flag
# "US"/"U.S."/"USA" and "UK"/"U.K." are recognized in capitals by countries.py. Add what is missing.

