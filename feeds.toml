# Countries ("editions"): the first one is the home page (site/index.html), the others go in site/<code>/.
# name = tab label (English); lang = language of that page's labels and dates (headlines are shown as published).
[[country]]
code = "int"
name = "International"
tz = "Europe/Madrid"
lang = "en"

[[country]]
code = "es"
name = "Spain"
tz = "Europe/Madrid"
lang = "es"

