# Candidate outlets: a waiting list, NOT read by the app.
# To adopt one, copy name/url/edition(country)/paywall into a [[feed]] block of feeds.toml and set status = "adopted".
# Check them with:  uv run python scripts/probe_feeds.py          (from this machine)
#                   sudo -u agregador /opt/agregador/.venv/bin/python /opt/agregador/scripts/probe_feeds.py   (from the server)
# Datacenter IPs get blocked by some outlets, so always probe from the server before adopting.
#
# status:  untested | ok | blocked | empty | rejected | adopted
# tested:  date and where, "laptop" or "server", with the HTTP code seen.
# notes:   depth of the feed, what it covers, editorial nature (public, state-funded, private, advocacy...). Disclose it.

